name: generate pacman game

on:
  schedule:
    - cron: "0 15 * * *" # 매일 한국시간 자정(UTC 15시)에 갱신
  workflow_dispatch: # Actions 탭에서 'Run workflow' 버튼으로 바로 실행 가능
  push:
    branches:
      - main # main 에 푸시할 때도 실행

jobs:
  generate:
    permissions:
      contents: write # output 브랜치에 파일을 올리기 위한 쓰기 권한
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1) 잔디 → 팩맨 게임 SVG 생성
      - name: generate pacman svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
          hide_month_labels: "false" # 'true' 로 바꾸면 위쪽 월 표시

      # 2) 만든 SVG 를 output 브랜치에 올리기
      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
